// Local files only. Upstream URLs, versions and licenses: src/main/assets/ocr/NOTICE.txt.
import java.security.MessageDigest

def engine = file('libs/tesseract4android-4.9.0.aar')
def pins = [
    (engine): 'bce5d6413a1a5ae3d7240033fbbc851ba3217d0a08d9769400e17a077f42cb2a',
    (file('src/main/assets/ocr/chi_sim.traineddata')): 'a5fcb6f0db1e1d6d8522f39db4e848f05984669172e584e8d76b6b3141e1f730',
    (file('src/main/assets/ocr/eng.traineddata')): '7d4322bd2a7749724879683fc3912cb542f19906c83bcc1a52132556427170b2',
]

dependencies {
    implementation files(engine)
    // The wrapper's annotations are class-file metadata, not runtime calls.
}

def verifyOcr = tasks.register('verifyBundledOcr') {
    inputs.files(pins.keySet())
    doLast {
        pins.each { artifact, expected ->
            def sha = MessageDigest.getInstance('SHA-256')
            artifact.withInputStream { stream ->
                byte[] buffer = new byte[64 * 1024]
                int n
                while ((n = stream.read(buffer)) != -1) sha.update(buffer, 0, n)
            }
            if (sha.digest().encodeHex().toString() != expected) {
                throw new GradleException("Unexpected OCR file digest: ${artifact.name}")
            }
        }
    }
}

tasks.named('preBuild').configure { dependsOn verifyOcr }
