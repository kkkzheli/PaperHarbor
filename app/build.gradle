plugins { id 'com.android.application' }
apply from: 'ocr.gradle'

def localProps = new Properties()
def localFile = rootProject.file('local.properties')
if (localFile.exists()) localFile.withInputStream { localProps.load(it) }

android {
    namespace 'io.github.kkkzheli.paperharbor'
    compileSdk 34
    defaultConfig {
        applicationId 'io.github.kkkzheli.paperharbor'
        minSdk 26
        targetSdk 34
        versionCode 3
        versionName '1.0.0'
        testInstrumentationRunner 'android.test.InstrumentationTestRunner'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    useLibrary 'android.test.runner', false
    useLibrary 'android.test.base', false
    useLibrary 'android.test.mock', false
    signingConfigs {
        release {
            // Local signing only. The keystore and its password live in local.properties,
            // which is never committed; the published APK carries only the public certificate.
            if (localProps.containsKey('ph.storeFile')) {
                storeFile file(localProps['ph.storeFile'])
                storePassword localProps['ph.storePassword']
                keyAlias localProps['ph.keyAlias']
                keyPassword localProps['ph.keyPassword']
            }
        }
    }
    buildTypes {
        debug { applicationIdSuffix '.debug' }
        release {
            minifyEnabled false
            debuggable false
            if (localProps.containsKey('ph.storeFile')) signingConfig signingConfigs.release
        }
    }
}
